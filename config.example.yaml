# lucyfer configuration.
#
# Exposes one speaker per entry in `speakers` — advertised over every enabled source
# (Spotify Connect and AirPlay) at once — decodes its audio in-process and transmits it
# as a stereo pair of TX channels on a single Dante device. Only one source drives a
# speaker at a time; the most recent one to start playing takes over and the other is
# paused. See README.md for the operational caveats (PTP clock requirement, the mDNS
# bind limitation, licensing).

dante:
  # BIND_IP passed to inferno: either an IPv4 address or a network interface name.
  # This is the interface on which Dante audio (and Dante's own mDNS) is sent.
  interface: "eth0"
  # Dante device name shown in Dante Controller.
  device_name: "lucyfer"
  # Dante network sample rate. Spotify decodes at 44100; anything else is resampled.
  # A mismatched subscriber sample rate is rejected by inferno, so this must match
  # the rest of your Dante network (commonly 48000).
  sample_rate: 48000
  # Transmit latency in nanoseconds (10 ms here).
  tx_latency_ns: 10000000
  # Media clock source. null -> inferno's default usrvclock socket.
  # Other values: a usrvclock socket path (e.g. "/clock/usrvclock") or "/dev/ptp0".
  clock_path: null

spotify:
  # Advertise every speaker over Spotify Connect.
  enabled: true
  # Interface IP advertised over mDNS for the Spotify Connect side. null advertises
  # on all interfaces. NOTE: only the mDNS advertisement is interface-scoped; the
  # librespot credential HTTP server always binds all interfaces (see README).
  interface_ip: null
  # Audio quality requested from Spotify: 96 | 160 | 320.
  bitrate: 320
  # Directory for per-speaker credential + audio cache. null disables caching.
  cache_dir: "/var/lib/lucyfer/cache"

airplay:
  # Advertise every speaker over AirPlay (AirPlay 1 / RAOP).
  enabled: true
  # Address the RTSP listener binds to. null binds all interfaces. NOTE: this pins the
  # listener only — the mDNS advertisement always covers every interface (see README).
  interface_ip: null
  # RTSP port for the first speaker; speaker N listens on base_port + N. With the two
  # speakers below that is 5000 and 5001.
  base_port: 5000

# MQTT control surface. Omit this block entirely to run without one.
mqtt:
  enabled: true
  # "host" or "host:port". Port defaults to 1883.
  broker: "10.0.0.5:1883"
  # MQTT client id. null -> "lucyfer".
  client_id: null
  # Credentials. Omit both for an anonymous broker. `password` and `password_file` are
  # mutually exclusive; `password_file` holds the password as its (trimmed) contents,
  # which keeps it out of this file.
  username: null
  password: null
  password_file: null
  # Topic prefix. Per speaker lucyfer publishes:
  #   <prefix>/<mqtt_name>/status    retained JSON: source, playback, track, volume, position
  #   <prefix>/<mqtt_name>/albumart  retained URL: Spotify's CDN link, or a base64 data: URL
  #                                  for AirPlay, which pushes raw cover bytes
  # and one bridge-wide topic:
  #   <prefix>/availability          retained "online" / "offline" (last will)
  prefix: "lucyfer"

speakers:
  # lucyfer always transmits full-scale audio to Dante and never attenuates it: volume
  # belongs to the amplifier, and is only reported and relayed over MQTT (see the two
  # topics below). Nothing is ever commanded on connect, so starting a speaker cannot
  # produce a sudden loud noise.
  - name: "Living Room" # name shown in Spotify and AirPlay; Dante channels "Living Room L" / "Living Room R"
    # Topic segment for this speaker. null -> the slug of `name`, i.e. "living-room".
    mqtt_name: "living-room"
    # The amplifier's *current* volume, 0-100. lucyfer SUBSCRIBES here: a value arriving
    # on this topic is pushed into Spotify and AirPlay so their sliders show the truth.
    volume_topic: "amps/living-room/volume"
    # The amplifier's *command* topic, 0-100. lucyfer PUBLISHES here when the user moves
    # the slider in the Spotify or AirPlay app. The amplifier applies it and mirrors it
    # back on `volume_topic`, closing the loop. Not retained: a retained command replayed
    # after a broker restart is exactly the volume jump this design avoids.
    volume_topic_set: "amps/living-room/volume/set"
  # Both volume topics must be given together, or neither. A speaker with neither is
  # published and reported as usual, but its volume is not relayed anywhere.
  - name: "Kitchen"
