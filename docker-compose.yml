# Development compose: runs lucyfer with a FAKE media clock (free-running
# CLOCK_MONOTONIC). This is enough to bring the service up and stream audio on a
# bench, but the fake clock drifts against a real Dante network's PTP clock, so it
# is NOT suitable for production. For production, drop the `clock` sidecar and set
# LUCYFER_PTP=1 to run the bundled Statime PTP daemon inside the lucyfer container
# (see README.md "Production clocking" and deploy/), or set
# `dante.clock_path: /dev/ptp0` on a host whose PHC is already disciplined.

volumes:
  clock:
  lucyfer-state:

services:
  # Dev-only fake usrvclock server (from the inferno test suite).
  clock:
    build: ./inferno/test/dockerized_trx/fake_usrvclock_server
    environment:
      - USRVCLOCK_SOCKET=/clock/usrvclock
    volumes:
      - clock:/clock

  lucyfer:
    build:
      context: .
      dockerfile: Dockerfile
    # Host networking is required so Spotify Connect / AirPlay mDNS and Dante's
    # multicast/unicast discovery + audio reach the LAN.
    network_mode: host
    environment:
      # The usrvclock client binds its reply socket under $TMPDIR and the server
      # (a separate container here) has to be able to open that path, so both ends
      # live on the shared volume. Not needed in production, where the PTP daemon
      # runs inside this container — see deploy/docker-compose.prod.yml.
      - TMPDIR=/clock
    volumes:
      - ./config.yaml:/etc/lucyfer/config.yaml:ro
      - lucyfer-state:/var/lib/lucyfer
      - clock:/clock
    ulimits:
      # Allow locking memory for the realtime audio threads.
      memlock: 200000000
    cap_add:
      # Allow the ring-writer thread to raise its scheduling priority.
      - SYS_NICE
    depends_on:
      - clock
    restart: unless-stopped
