[package]
name = "lucyfer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Spotify Connect and AirPlay speakers bridged to Dante (Audio over IP)"

# lucyfer is a standalone package. inferno/ is its own cargo workspace (nested under
# this dir), so its path-dependency crates resolve workspace inheritance against that
# root. We deliberately do NOT declare a [workspace] table here: an empty one would
# auto-adopt the nested crates as members and break their `edition.workspace = true`
# inheritance.
[dependencies]
librespot-core = { version = "0.8", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-playback = { version = "0.8", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-connect = { version = "0.8", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-discovery = { version = "0.8", default-features = false, features = [
    "with-libmdns",
    "rustls-tls-native-roots",
] }
librespot-metadata = { version = "0.8", default-features = false, features = [
    "rustls-tls-native-roots",
] }

# AirPlay receiver. Default features = AirPlay 1 only: the `ap2` feature's handlers
# deliver no metadata/artwork/volume/remote-control callbacks, so AP1 is the only mode
# that can populate the API's now-playing state.
shairplay = "0.7"

inferno_aoip = { path = "inferno/inferno_aoip" }
usrvclock = { path = "inferno/usrvclock-rs" }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "signal",
    "time",
    "net",
] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rubato = "0.16"
ringbuf = "0.4"
sha1 = "0.10"
hex = "0.4"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
thread-priority = "1"
