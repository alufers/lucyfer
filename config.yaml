# Config used by docker-compose.yml (dev). Edit `dante.interface` and
# `spotify.interface_ip` to match your host, then `docker compose up --build`.
# See config.example.yaml for the fully documented schema.

dante:
  interface: "enp195s0f0" # <-- set to your Dante NIC name or its IPv4 address
  device_name: "lucyfer"
  sample_rate: 48000
  tx_latency_ns: 10000000
  # Media clock source. This host has no PTP hardware clock, so point this at the
  # usrvclock socket published by a PTP daemon (Statime/ptp4l bridge). null uses
  # inferno's default socket (/tmp/ptp-usrvclock). Use "/dev/ptp0" only on a host
  # whose NIC PHC is already PTP-synced.
  clock_path: "/tmp/ptp-usrvclock"
  ring_len: 65536

spotify:
  enabled: true
  interface_ip: null # <-- optionally pin the mDNS advertisement to one IP
  bitrate: 320
  cache_dir: "./spotify-cache"

airplay:
  enabled: true
  interface_ip: null # <-- optionally pin the RTSP listener to one IP
  base_port: 5000 # speaker N listens on base_port + N

speakers:
  - name: "Eleleab"
    apply_volume: false
    initial_volume: 0.6
  - name: "Audytorium"
    apply_volume: false

audio:
  pacing_buffer_ms: 150
  lead_ms: 30

api:
  bind: "0.0.0.0:8080"
