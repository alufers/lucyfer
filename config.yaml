# Config used by docker-compose.yml (dev). Edit `dante.interface` and
# `spotify.interface_ip` to match your host, then `docker compose up --build`.
# See config.example.yaml for the fully documented schema.

dante:
  interface: "10.165.1.192" # <-- set to your Dante NIC name or its IPv4 address
  device_name: "lucyfer"
  sample_rate: 48000
  tx_latency_ns: 10000000
  # Media clock source. This dev setup takes it from the fake usrvclock sidecar in
  # docker-compose.yml, which publishes its socket on the shared `clock` volume.
  # In production the bundled Statime daemon (LUCYFER_PTP=1) publishes it at
  # inferno's default path instead, and this can be null.
  clock_path: "/clock/usrvclock"

spotify:
  enabled: true
  interface_ip: null # <-- optionally pin the mDNS advertisement to one IP
  bitrate: 320
  cache_dir: "./spotify-cache"

airplay:
  enabled: true
  interface_ip: null # <-- optionally pin the RTSP listener to one IP
  base_port: 5000 # speaker N listens on base_port + N

# mqtt:
#   broker: "10.165.1.1:1883"
#   username: null
#   password: null
#   prefix: "lucyfer"

speakers:
  - name: "Elelab"
  - name: "Audytorium"
  - name: "Arts and Crafts"
  - name: "Kuźnia"
  - name: "CNC"
  - name: "Maszynownia"
